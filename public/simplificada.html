<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santos & Mello • Recomendações Helena CRM</title>
  <script>
    // Preserva todos os parâmetros da query (como contactId={{contact.id}}) e ativa o modo simplificado
    const params = new URLSearchParams(window.location.search);
    params.set('mode', 'simple');
    params.set('embedded', 'true');
    window.location.replace('/?' + params.toString());
  </script>
  <style>
    body {
      background: #0b0f19;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <p>Carregando perfil do lead e recomendações...</p>
</body>
</html>
